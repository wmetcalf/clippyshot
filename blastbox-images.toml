# ClippyShot's image chain, declared once.
#
# Before this file there was no build path at all: the chain lived in
# blastbox's deploy/redeploy-warm.sh as a block of preset variables, and
# rebuilding meant reading that script to find out what built what. Two of the
# four Dockerfiles live in blastbox rather than here, which is exactly the kind
# of thing nobody remembers a year later.
#
# Build and export with:
#   BLASTBOX_SRC=<blastbox source tree> blastbox build-images . --tag <tag>
# Add --dry-run to see exactly what it would do and touch nothing.

[engine]
name = "clippyshot"

# The one image built from THIS repo. Everything else is layered on it.
[[image]]
name = "clippyshot"
dockerfile = "deploy/docker/Dockerfile"
base = "ubuntu:24.04"
# Not a literal: a second copy of the pyproject pin would drift from it, and
# the image would then install a version its own stamp does not name.
build_args = { BLASTBOX_VERSION = "$BLASTBOX_VERSION" }

# Cold worker: blastbox core only (no [host]); its Dockerfile lives in blastbox.
[[image]]
name = "clippyshot-cold-worker"
dockerfile = "deploy/docker/Dockerfile.clippyshot-cold-worker"
base = "clippyshot"
context = "$BLASTBOX_SRC"
source_repo = "$BLASTBOX_SRC"

# Firecracker guest: the blastbox FC agent + /init + warm-UNO soffice.
[[image]]
name = "clippyshot-fc-worker"
dockerfile = "deploy/firecracker/Dockerfile.clippyshot"
base = "clippyshot"
context = "$BLASTBOX_SRC"
source_repo = "$BLASTBOX_SRC"
build_args = { ENGINE = "clippyshot" }

# gVisor warm guest, layered on the COLD WORKER with blastbox's clippyshot-specific Dockerfile
# (run_warm.py + engines.py + the engine selector). The generic Dockerfile.shim on the host image
# built a guest the warm tier could not run; this one is proven on toolz2 (warm, 8/8).
# base_arg is "BASE": blastbox's gVisor Dockerfiles use the shorter name, and docker silently
# discards a --build-arg the Dockerfile never declares.
[[image]]
name = "clippyshot-warm-gvisor"
dockerfile = "deploy/gvisor/Dockerfile.clippyshot"
base = "clippyshot-cold-worker"
base_arg = "BASE"
context = "$BLASTBOX_SRC"
source_repo = "$BLASTBOX_SRC"
build_args = { ENGINE = "clippyshot.engine:ClippyShotEngine" }

# runsc restores a DIRECTORY tree. No /init: runsc launches the warm argv directly.
[[rootfs]]
kind = "dir"
image = "clippyshot-warm-gvisor"
dest = "${CLIPPYSHOT_GVISOR_DIR:-/var/lib/clippyshot-gvisor}/rootfs"
requires = ["/opt/blastbox/run_warm.py", "/opt/blastbox/engines.py", "/opt/blastbox/engine", "/in", "/out", "/ctrl"]

# The ext4 the microVM boots. `requires` refuses an image that cannot boot or serve.
[[rootfs]]
kind = "ext4"
image = "clippyshot-fc-worker"
dest = "${CLIPPYSHOT_FC_DIR:-/var/lib/clippyshot-fc}/rootfs.ext4"
size_mib = "${ROOTFS_MIB:-7000}"
requires = ["/init", "/opt/blastbox/guest.env", "/opt/blastbox/run_guest.py", "/opt/blastbox/engine"]
