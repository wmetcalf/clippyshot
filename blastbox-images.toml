# ClippyShot's image chain, declared once.
#
# Before this file there was no build path at all: the chain lived in
# blastbox's deploy/redeploy-warm.sh as a block of preset variables, and
# rebuilding meant reading that script to find out what built what. Two of the
# four Dockerfiles live in blastbox rather than here, which is exactly the kind
# of thing nobody remembers a year later.
#
# Build and export with:
#   BLASTBOX_SRC=<blastbox source tree> blastbox build-images . --tag <tag>
# Add --dry-run to see exactly what it would do and touch nothing.

[engine]
name = "clippyshot"

# The one image built from THIS repo. Everything else is layered on it.
[[image]]
name = "clippyshot"
dockerfile = "deploy/docker/Dockerfile"
base = "ubuntu:24.04"
# Not a literal: a second copy of the pyproject pin would drift from it, and
# the image would then install a version its own stamp does not name.
build_args = { BLASTBOX_VERSION = "$BLASTBOX_VERSION" }

# Built from blastbox's tree, and stamped with THAT tree's revision -- ours
# would name a commit that does not contain the file which built them.
[[image]]
name = "clippyshot-cold-worker"
dockerfile = "deploy/docker/Dockerfile.clippyshot-cold-worker"
base = "clippyshot"
context = "$BLASTBOX_SRC"

# NOTE THE ARG NAME. This one is `BASE`, not `BASE_IMAGE`, because it is the
# shared gVisor shim rather than an engine-specific file. docker silently
# ignores a --build-arg the Dockerfile does not declare, so getting this wrong
# pins nothing and stamps a digest the build never used; `blastbox build-images`
# refuses rather than building that.
[[image]]
name = "clippyshot-warm-gvisor"
dockerfile = "deploy/gvisor/Dockerfile.shim"
base = "clippyshot"
base_arg = "BASE"
context = "$BLASTBOX_SRC"

[[image]]
name = "clippyshot-fc-worker"
dockerfile = "deploy/firecracker/Dockerfile.clippyshot"
base = "clippyshot"
context = "$BLASTBOX_SRC"

# The DEFAULTS match the compose files, which are what actually mount these.
# They were taken from blastbox's redeploy-warm.sh, whose presets point at
# /home/coz/... -- so an unset build wrote where nothing reads. The deployed
# .env sets both variables, so in practice they agreed; a default build did not.
[[rootfs]]
kind = "dir"
image = "clippyshot-warm-gvisor"
dest = "${CLIPPYSHOT_GVISOR_DIR:-/var/lib/clippyshot-gvisor}/rootfs"

[[rootfs]]
kind = "ext4"
image = "clippyshot-fc-worker"
dest = "${CLIPPYSHOT_FC_DIR:-/var/lib/clippyshot-fc}/rootfs.ext4"
# 7000 MiB: this engine carries LibreOffice and a tesseract data set, so it is
# several times the size of the other two engines' rootfs. Overridable, as the
# script it replaces was -- a deployment that grew this deliberately must not be
# shrunk back by a literal in the spec.
size_mib = "${ROOTFS_MIB:-7000}"
# The guest boots /init, which execs run_guest.py against a baked guest.env.
requires = ["/init", "/opt/blastbox/guest.env"]
