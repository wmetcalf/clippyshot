name: ci

on:
  push:
    branches: [master]   # ClippyShot's default branch is master (not main)
  pull_request:

# These jobs only read the repo; least-privilege the token.
permissions:
  contents: read

# ClippyShot's integration/docker suites need real soffice + a sandbox backend /
# Docker daemon (they run inside the built image, not on hosted CI) and are
# marker-gated. This workflow runs the host-safe tiers: lint, types, and the
# pure unit/cli/http tests.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Several unit tests shell out to real binaries (tesseract for OCR, ZXingReader for QR,
      # bwrap for the sandbox). Install them so those tests run instead of erroring. nsjail is
      # not packaged for Ubuntu — its tests self-skip when it's absent.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng zxing-cpp-tools bubblewrap
      # ubuntu-latest moved to ubuntu-26.04, which ships aa-exec (package `apparmor`) and Ubuntu's
      # stock bwrap-userns-restrict profile. BwrapSandbox finds `aa-exec` and attaches the
      # clippyshot-soffice profile to its sandboxed children by default; by design it fails
      # closed when it cannot ("profile ... does not exist", then "insufficient permissions to change to the profile" once loaded, because
      # bwrap-userns-restrict stacks bwrap's children into `unpriv_bwrap`, which may not change
      # profile). Configure the host the way deploy/apparmor/README.md tells an operator to:
      # unload bwrap-userns-restrict (it and clippyshot-bwrap both attach /usr/bin/bwrap, and
      # with both loaded bwrap cannot even write its uid map), then load the ClippyShot
      # profiles. The final probe fails this step unless sandboxed bwrap + aa-exec runs, so the
      # bwrap tests can never pass here by skipping. It passes `--proc /proc` like BwrapSandbox
      # (bwrap.py): without a pid namespace that is a writable bind of the host procfs rather
      # than the fresh one --unshare-all gives, but either way aa-exec can write
      # /proc/self/attr/exec; under the inherited read-only /proc it cannot on some libapparmor
      # versions (24.04: "Read-only file system").
      # The runner is ephemeral, so the unload is not made persistent here; on a real host see
      # deploy/apparmor/README.md for that step and for what unloading the stock profile costs.
      - name: Load AppArmor profiles
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo cp deploy/apparmor/clippyshot-bwrap deploy/apparmor/clippyshot-nsjail \
            deploy/apparmor/clippyshot-soffice deploy/apparmor/clippyshot-runtime /etc/apparmor.d/
          for p in clippyshot-bwrap clippyshot-nsjail clippyshot-soffice clippyshot-runtime; do
            sudo apparmor_parser -r -W "/etc/apparmor.d/$p"
          done
          sudo aa-status | grep clippyshot
          bwrap --unshare-user --die-with-parent --ro-bind / / --proc /proc -- \
            aa-exec -p clippyshot-soffice -- /bin/true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest (unit + cli + http)
        run: pytest -q tests/unit tests/cli tests/http
      # COLLECT the integration tree as well. Running it needs soffice and a sandbox
      # backend this runner does not have, but collecting it is free and catches the
      # failure mode that hid a whole directory: `tests/integration/conftest.py` imported
      # an undeclared dependency, so the tree ERRORED rather than skipped -- in every
      # environment built from pyproject, and invisibly here, because CI never named it.
      - name: Collect the integration tests (imports + fixtures must resolve)
        run: pytest --collect-only -q tests/integration

  # Build the shipped image and prove, inside it, that ClippyShot's OWN nsjail and bwrap
  # sandboxes enforce their seccomp filter and refuse to run when it is not enforced. Both
  # once shipped without one (nsjail's bundled kafel rejected `io_uring_setup`; bwrap's BPF
  # builder could not import libseccomp in the image's venv), invisibly to every host test.
  image-seccomp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The sandboxes in the container create user namespaces; on this runner that needs the
      # ClippyShot profiles that attach to /usr/bin/bwrap and /usr/local/bin/nsjail (see the
      # `test` job and deploy/apparmor/README.md).
      - name: Load AppArmor profiles
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
          sudo cp deploy/apparmor/clippyshot-bwrap deploy/apparmor/clippyshot-nsjail \
            deploy/apparmor/clippyshot-soffice deploy/apparmor/clippyshot-runtime /etc/apparmor.d/
          for p in clippyshot-bwrap clippyshot-nsjail clippyshot-soffice clippyshot-runtime; do
            sudo apparmor_parser -r -W "/etc/apparmor.d/$p"
          done
      - name: Build the image
        run: docker build -f deploy/docker/Dockerfile -t clippyshot:dev .
      - name: Install
        run: python -m pip install -e ".[dev]"
      # REQUIRE: a missing docker or image fails the job instead of skipping it.
      - name: In-image seccomp tests
        env:
          CLIPPYSHOT_TEST_IMAGE: clippyshot:dev
          CLIPPYSHOT_REQUIRE_DOCKER_TESTS: "1"
        run: pytest -q -rs tests/docker/test_inner_seccomp.py
