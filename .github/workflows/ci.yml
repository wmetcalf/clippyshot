name: ci

on:
  push:
    branches: [master]   # ClippyShot's default branch is master (not main)
  pull_request:

# These jobs only read the repo; least-privilege the token.
permissions:
  contents: read

# ClippyShot's integration/docker suites need real soffice + a sandbox backend /
# Docker daemon (they run inside the built image, not on hosted CI) and are
# marker-gated. This workflow runs the host-safe tiers: lint, types, and the
# pure unit/cli/http tests.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Several unit tests shell out to real binaries (tesseract for OCR, ZXingReader for QR,
      # bwrap for the sandbox). Install them so those tests run instead of erroring. nsjail is
      # not packaged for Ubuntu — its tests self-skip when it's absent.
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng zxing-cpp-tools bubblewrap
      # The runner image ships apparmor-utils, so BwrapSandbox finds `aa-exec` and attaches
      # the clippyshot-soffice profile to every sandboxed child -- by design it fails closed
      # ("aa-exec: ERROR: profile 'clippyshot-soffice' does not exist") rather than run
      # unconfined. Load that profile (deploy/apparmor/README.md) so CI exercises the confined
      # path production runs.
      #
      # Ubuntu 24.04's kernel.apparmor_restrict_unprivileged_userns=1 puts the children of an
      # unconfined process's user namespace in the `unprivileged_userns` profile, which may not
      # change profile ("aa-exec: ERROR: insufficient permissions to change to the profile").
      # Production grants bwrap userns through deploy/apparmor/clippyshot-bwrap; on this
      # throwaway runner that profile collides with the image's own bwrap attachment, so lift
      # the restriction instead. The final probe fails the step if sandboxed bwrap + aa-exec
      # cannot run, so the bwrap tests can never pass by skipping here.
      - name: Load AppArmor profiles
        run: |
          set +e
          echo "== diag"; uname -r; sysctl kernel.apparmor_restrict_unprivileged_userns
          ls -l /etc/apparmor.d | grep -i -E "bwrap|unpriv|userns"; sudo aa-status | grep -i -E "bwrap|unpriv"
          which -a bwrap aa-exec; bwrap --version
          bwrap --unshare-user --die-with-parent --ro-bind / / -- /bin/true; echo "plain=$?"
          bwrap --unshare-user --die-with-parent --ro-bind / / -- cat /proc/self/attr/current; echo
          sudo cp deploy/apparmor/clippyshot-bwrap /etc/apparmor.d/ && sudo apparmor_parser -r -W /etc/apparmor.d/clippyshot-bwrap; echo "loadbwrap=$?"
          sudo apparmor_parser -r -W deploy/apparmor/clippyshot-soffice; echo "loadsoffice=$?"
          bwrap --unshare-user --die-with-parent --ro-bind / / -- /bin/true; echo "withprof=$?"
          bwrap --unshare-user --die-with-parent --ro-bind / / -- cat /proc/self/attr/current; echo
          bwrap --unshare-user --die-with-parent --ro-bind / / -- aa-exec -p clippyshot-soffice -- /bin/true; echo "aaexec=$?"
          sudo dmesg | grep -i apparmor | tail -15
          exit 1
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo cp deploy/apparmor/clippyshot-soffice deploy/apparmor/clippyshot-runtime /etc/apparmor.d/
          for p in clippyshot-soffice clippyshot-runtime; do
            sudo apparmor_parser -r -W "/etc/apparmor.d/$p"
          done
          sudo aa-status | grep clippyshot
          bwrap --unshare-user --die-with-parent --ro-bind / / -- \
            aa-exec -p clippyshot-soffice -- /bin/true
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Pytest (unit + cli + http)
        run: pytest -q tests/unit tests/cli tests/http
      # COLLECT the integration tree as well. Running it needs soffice and a sandbox
      # backend this runner does not have, but collecting it is free and catches the
      # failure mode that hid a whole directory: `tests/integration/conftest.py` imported
      # an undeclared dependency, so the tree ERRORED rather than skipped -- in every
      # environment built from pyproject, and invisibly here, because CI never named it.
      - name: Collect the integration tests (imports + fixtures must resolve)
        run: pytest --collect-only -q tests/integration
